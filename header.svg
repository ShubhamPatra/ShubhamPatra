<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <style>
    .bg { fill: #f3f4f1; }
    .ink { fill: #1a1a1a; }
    .red { fill: #b91c1c; }
    .blue { fill: #1e3a8a; }
    .white { fill: #f3f4f1; }
    
    .pixel { 
      font-family: 'Courier New', Consolas, monospace;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .terminal {
      font-family: 'Courier New', Consolas, monospace;
    }
    
    .cursor {
      fill: #b91c1c;
      animation: blink 1s step-end infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    
    .line1 { animation: fadeIn 0.4s ease-in 0.2s forwards; opacity: 0; }
    .line2 { animation: fadeIn 0.4s ease-in 0.5s forwards; opacity: 0; }
    .line3 { animation: fadeIn 0.4s ease-in 0.8s forwards; opacity: 0; }
    
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
  
  <!-- Paper background -->
  <rect class="bg" width="800" height="200"/>
  
  <!-- Spider web - Top Left Corner (ink color) -->
  <g opacity="0.3" stroke="#1a1a1a" stroke-width="0.8" fill="none">
    <line x1="0" y1="0" x2="120" y2="120"/>
    <line x1="0" y1="0" x2="120" y2="60"/>
    <line x1="0" y1="0" x2="120" y2="0"/>
    <line x1="0" y1="0" x2="60" y2="120"/>
    <line x1="0" y1="0" x2="0" y2="120"/>
    <line x1="0" y1="0" x2="84" y2="30"/>
    <line x1="0" y1="0" x2="30" y2="84"/>
    <path d="M 24 0 Q 24 24 0 24"/>
    <path d="M 48 0 Q 48 48 0 48"/>
    <path d="M 72 0 Q 72 72 0 72"/>
    <path d="M 96 0 Q 96 96 0 96"/>
    <path d="M 120 0 Q 120 120 0 120"/>
  </g>
  
  <!-- Spider web - Top Right Corner (red color) -->
  <g opacity="0.25" stroke="#b91c1c" stroke-width="0.8" fill="none" transform="translate(800,0) scale(-1,1)">
    <line x1="0" y1="0" x2="100" y2="100"/>
    <line x1="0" y1="0" x2="100" y2="50"/>
    <line x1="0" y1="0" x2="100" y2="0"/>
    <line x1="0" y1="0" x2="50" y2="100"/>
    <line x1="0" y1="0" x2="0" y2="100"/>
    <line x1="0" y1="0" x2="70" y2="25"/>
    <line x1="0" y1="0" x2="25" y2="70"/>
    <path d="M 20 0 Q 20 20 0 20"/>
    <path d="M 40 0 Q 40 40 0 40"/>
    <path d="M 60 0 Q 60 60 0 60"/>
    <path d="M 80 0 Q 80 80 0 80"/>
    <path d="M 100 0 Q 100 100 0 100"/>
  </g>
  
  <!-- Spider web - Bottom Right Corner (blue color) -->
  <g opacity="0.25" stroke="#1e3a8a" stroke-width="0.8" fill="none" transform="translate(800,200) scale(-1,-1)">
    <line x1="0" y1="0" x2="80" y2="80"/>
    <line x1="0" y1="0" x2="80" y2="40"/>
    <line x1="0" y1="0" x2="80" y2="0"/>
    <line x1="0" y1="0" x2="40" y2="80"/>
    <line x1="0" y1="0" x2="0" y2="80"/>
    <path d="M 20 0 Q 20 20 0 20"/>
    <path d="M 40 0 Q 40 40 0 40"/>
    <path d="M 60 0 Q 60 60 0 60"/>
    <path d="M 80 0 Q 80 80 0 80"/>
  </g>
  
  <!-- Border -->
  <rect x="8" y="8" width="784" height="184" fill="none" stroke="#1a1a1a" stroke-width="4"/>
  
  <!-- Status badge -->
  <g class="line1">
    <rect x="60" y="30" width="180" height="32" fill="#1a1a1a"/>
    <text x="150" y="52" class="pixel white" font-size="12" text-anchor="middle">STATUS: ONLINE</text>
  </g>
  
  <!-- Main title -->
  <text x="60" y="100" class="pixel ink line2" font-size="42">HELLO!</text>
  <text x="60" y="150" class="pixel red line2" font-size="42">I'M SHUBHAM</text>
  
  <!-- Tagline -->
  <text x="60" y="180" class="terminal ink line3" font-size="18">→ Full-stack developer | Building things that work</text>
  
  <!-- Blinking cursor at end -->
  <rect x="600" y="162" width="14" height="22" class="cursor line3"/>
</svg>
